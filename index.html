<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="FinChronicleLedger — Offline-first personal finance tracker with double-entry accounting. Track expenses, income, transfers and manage your money with complete financial accuracy. Works completely offline.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FCLedger">
    <meta name="theme-color" content="#0051D5">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; script-src 'self'; connect-src 'self'">
    <title>FinChronicleLedger - Track Your Financial Journey</title>

    <!-- PWA Icons -->
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <!-- Remix Icon CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet"
        integrity="sha384-RwhG+8423fpoSoUMjpibFzMxLQeaO7oBV45/+IxuLaxxiUOFL9R+OzbK5rBpSazc" crossorigin="anonymous">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/dark-mode.css">
</head>

<body>
    <!-- Skip to Main Content (Accessibility) -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Modal Mount Point -->
    <div id="modalMount"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <h1>
                    <i class="ri-book-shelf-line"></i>
                    <span class="title-text">
                        <span class="fin-text">Fin</span><span class="chronicle-text">Chronicle</span><span class="ledger-text">Ledger</span>
                    </span>
                </h1>
                <div class="header-meta">
                    <span class="status-inline"><span class="status-dot"></span> Offline</span>
                    <span class="version" id="appVersion">v1.0.0</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content">

            <!-- Install Prompt (iOS) -->
            <div class="install-prompt" id="installPrompt">
                <h3><i class="ri-smartphone-line"></i> Install App</h3>
                <p>Tap Share → Add to Home Screen for best experience</p>
                <button id="dismissInstallPrompt">Got it!</button>
            </div>

            <!-- ============================================================
                 ADD TAB
                 ============================================================ -->
            <div id="addTab" class="tab-content active" data-tab="add">
                <!-- Summary Section -->
                <div id="summary-container"></div>

                <!-- Form Section -->
                <div class="card">
                    <div id="form-container"></div>
                </div>
            </div>

            <!-- ============================================================
                 LIST TAB
                 ============================================================ -->
            <div id="listTab" class="tab-content" data-tab="list">
                <div id="filters-container"></div>
                <div class="card">
                    <div id="list-container"></div>
                </div>
                <div id="pagination-container"></div>
            </div>

            <!-- ============================================================
                 GROUPS TAB
                 ============================================================ -->
            <div id="groupsTab" class="tab-content" data-tab="groups">
                <div id="groups-container"></div>
            </div>

            <!-- ============================================================
                 REPORTS TAB (Advanced Mode only)
                 ============================================================ -->
            <div id="reportsTab" class="tab-content advanced-only" data-tab="reports">
                <div id="reports-container"></div>
            </div>

            <!-- ============================================================
                 SETTINGS TAB
                 ============================================================ -->
            <div id="settingsTab" class="tab-content" data-tab="settings">
                <div id="settings-container"></div>
            </div>

        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav" role="navigation" aria-label="Main navigation">
        <button class="nav-btn active" data-tab="add" aria-label="Add Transaction">
            <i class="ri-add-line nav-btn-icon"></i>
            <span>Add</span>
        </button>
        <button class="nav-btn" data-tab="list" aria-label="Transaction List">
            <i class="ri-list-check nav-btn-icon"></i>
            <span>List</span>
        </button>
        <button class="nav-btn" data-tab="groups" aria-label="Groups & Insights">
            <i class="ri-bar-chart-2-line nav-btn-icon"></i>
            <span>Groups</span>
        </button>
        <button class="nav-btn advanced-only" data-tab="reports" aria-label="Reports">
            <i class="ri-file-chart-line nav-btn-icon"></i>
            <span>Reports</span>
        </button>
        <button class="nav-btn" data-tab="settings" aria-label="Settings">
            <i class="ri-settings-3-line nav-btn-icon"></i>
            <span>Settings</span>
        </button>
    </nav>

    <!-- ================================================================
         Scripts - loaded in strict dependency order
         ================================================================ -->

    <!-- Domain layer (pure logic, no dependencies) -->
    <script src="js/domain/types.js"></script>
    <script src="js/domain/validators.js"></script>
    <script src="js/domain/accounting.js"></script>
    <script src="js/domain/ledger.js"></script>
    <script src="js/domain/chart-of-accounts.js"></script>
    <script src="js/domain/reports.js"></script>
    <script src="js/domain/recurring.js"></script>
    <script src="js/domain/budget.js"></script>

    <!-- Infrastructure layer (depends on types) -->
    <script src="js/infrastructure/db.js"></script>
    <script src="js/infrastructure/storage.js"></script>
    <script src="js/infrastructure/file-io.js"></script>

    <!-- Application layer: state must load first -->
    <script src="js/application/state.js"></script>
    <script src="js/application/transaction-service.js"></script>
    <script src="js/application/account-service.js"></script>
    <script src="js/application/report-service.js"></script>
    <script src="js/application/migration-service.js"></script>
    <script src="js/application/import-export-service.js"></script>
    <script src="js/application/backup-service.js"></script>
    <script src="js/application/settings-service.js"></script>
    <script src="js/application/search-service.js"></script>
    <script src="js/application/recurring-service.js"></script>
    <script src="js/application/budget-service.js"></script>
    <script src="js/application/tag-service.js"></script>
    <script src="js/application/csv-import-service.js"></script>

    <!-- UI layer (depends on Application) -->
    <script src="js/ui/renderer.js"></script>
    <script src="js/ui/forms.js"></script>
    <script src="js/ui/list.js"></script>
    <script src="js/ui/summary.js"></script>
    <script src="js/ui/groups.js"></script>
    <script src="js/ui/reports-ui.js"></script>
    <script src="js/ui/modals.js"></script>
    <script src="js/ui/navigation.js"></script>
    <script src="js/ui/settings-ui.js"></script>

    <!-- Entry point (orchestrates everything) -->
    <script src="js/app.js"></script>

</body>

</html>
